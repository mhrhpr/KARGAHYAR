name: KARGAHYAR Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: kargahyar-android-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --workspace apps/mobile --ignore-scripts
      - run: npx eas-cli@latest --version

      - name: Build Android APK with EAS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > ../../eas-build.json

      - name: Extract APK URL
        id: apk
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
          const build = Array.isArray(data) ? data[0] : data;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          if (!url) throw new Error('EAS build finished without an application archive URL');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'url=' + url + '\n');
          NODE

      - name: Download APK
        run: curl -fL "${{ steps.apk.outputs.url }}" -o kargahyar.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            TAG="v1.0.0"
          fi
          gh release delete "${TAG}" --yes 2>/dev/null || true
          gh release create "${TAG}" kargahyar.apk --title "KARGAHYAR ${TAG}" --notes "Android release for KARGAHYAR."

      - name: Show public download URL
        run: echo "https://github.com/mhrhpr/KARGAHYAR/releases/latest/download/kargahyar.apk"
