name: KARGAHYAR Android Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: kargahyar-android-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --prefix apps/mobile --workspaces=false --ignore-scripts
      - run: npx eas-cli@latest --version

      - name: Generate mobile lockfile
        working-directory: apps/mobile
        run: npm install --package-lock-only --ignore-scripts

      - name: Expo Doctor
        working-directory: apps/mobile
        run: npx expo-doctor --verbose

      - name: Ensure EAS project is linked
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest init --account mhrhpr --non-interactive

      - name: Build Android APK with EAS
        id: eas-build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          timeout 30m npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > ../../eas-build.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Diagnose EAS build failure
        if: steps.eas-build.outcome == 'failure'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          try {
            const raw = fs.readFileSync('../../eas-build.json', 'utf8').trim();
            const data = JSON.parse(raw);
            const build = Array.isArray(data) ? data[0] : data;
            if (build?.id) process.env.EAS_BUILD_ID = build.id;
            console.log('EAS_BUILD_ID=' + (build?.id || 'unknown'));
            console.log(JSON.stringify({
              id: build?.id,
              status: build?.status,
              platform: build?.platform,
              profile: build?.buildProfile,
              error: build?.error || null,
              artifacts: build?.artifacts || null,
            }, null, 2));
          } catch (error) {
            console.log('Could not parse eas-build.json:', error.message);
          }
          NODE
          if [ ! -f ../../eas-build.json ]; then exit 0; fi
          BUILD_ID=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('../../eas-build.json','utf8')); const b=Array.isArray(x)?x[0]:x; process.stdout.write(b?.id||'')")
          if [ -n "$BUILD_ID" ]; then
            npx eas-cli@latest build:view "$BUILD_ID" --json || true
          fi

      - name: Extract APK URL
        id: apk
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
          const build = Array.isArray(data) ? data[0] : data;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          if (!url) throw new Error('EAS build finished without an application archive URL');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'url=' + url + '\n');
          NODE

      - name: Download APK
        run: curl -fL "${{ steps.apk.outputs.url }}" -o kargahyar.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            TAG="v1.0.0"
          fi
          gh release delete "${TAG}" --yes 2>/dev/null || true
          gh release create "${TAG}" kargahyar.apk --title "KARGAHYAR ${TAG}" --notes "Android release for KARGAHYAR."

      - name: Show public download URL
        run: echo "https://github.com/mhrhpr/KARGAHYAR/releases/latest/download/kargahyar.apk"
