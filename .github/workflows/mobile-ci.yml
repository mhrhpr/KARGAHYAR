name: KARGAHYAR Mobile CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: kargahyar-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --workspace apps/mobile run typecheck
